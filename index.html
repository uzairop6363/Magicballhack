<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>C9 UZAIR - AIR UI</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: sans-serif; color: white; }
        #v { position: fixed; width: 100%; height: 100%; object-fit: cover; opacity: 0.2; transform: scaleX(-1); }
        
        /* Gallery Container */
        #gallery {
            position: relative; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .card {
            position: absolute; width: 280px; height: 400px;
            background: linear-gradient(45deg, #00ff41, #008f11);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 50px; font-weight: bold; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }

        #ui-status { position: fixed; top: 40px; width: 100%; text-align: center; font-weight: bold; color: #00ff41; z-index: 100; }
        .hint { position: fixed; bottom: 40px; width: 100%; text-align: center; font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <video id="v" autoplay playsinline></video>
    
    <div id="ui-status">MOVING AIR SENSOR ACTIVE</div>

    <div id="gallery">
        <div class="card" id="card1">PHOTO 1</div>
    </div>

    <div class="hint">Swipe your hand Left/Right in the air to change photos</div>

<script>
    const card = document.getElementById('card1');
    const msg = document.getElementById('ui-status');
    let photos = ["PHOTO 1", "PHOTO 2", "PHOTO 3", "PHOTO 4"];
    let currentIndex = 0;

    async function startAI() {
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7});
        hands.onResults(onResults);

        const cam = new Camera(document.getElementById('v'), {
            onFrame: async () => await hands.send({image: document.getElementById('v')}),
            width: 640, height: 480
        });
        cam.start();
    }

    let lastX = null;
    let canSwipe = true;

    function onResults(res) {
        if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0) {
            lastX = null;
            return;
        }

        // 9 is the palm center
        let currentX = res.multiHandLandmarks[0][9].x;

        if (lastX !== null && canSwipe) {
            let diff = currentX - lastX;

            // Sensitivity threshold
            if (Math.abs(diff) > 0.15) {
                if (diff > 0) handleSwipe("RIGHT");
                else handleSwipe("LEFT");
                
                canSwipe = false;
                setTimeout(() => { canSwipe = true; }, 1000); // Cool-down
            }
        }
        lastX = currentX;
    }

    function handleSwipe(dir) {
        msg.innerText = "AIR SWIPE: " + dir;
        
        let moveOut = dir === "RIGHT" ? 500 : -500;
        
        // Animation
        gsap.to(card, { x: moveOut, opacity: 0, duration: 0.4, onComplete: () => {
            currentIndex = (currentIndex + 1) % photos.length;
            card.innerText = photos[currentIndex];
            gsap.fromTo(card, { x: -moveOut, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4 });
        }});

        setTimeout(() => { msg.innerText = "MOVING AIR SENSOR ACTIVE"; }, 1000);
    }

    startAI();
</script>
</body>
</html>
