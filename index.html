<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Wallpaper */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop') center/cover;
            z-index: 100; transition: transform 0.6s ease-in-out;
            display: flex; flex-direction: column; align-items: center;
        }

        #time { color: white; font-size: 85px; font-weight: 200; margin-top: 100px; }
        #status { position: fixed; bottom: 40px; color: #00ff41; font-family: monospace; font-size: 12px; z-index: 101; }

        /* Fake Desktop */
        #home-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1614850523296-e8c041de2394?q=80&w=2070&auto=format&fit=crop') center/cover;
            display: grid; grid-template-columns: repeat(4, 1fr); padding: 30px; gap: 20px;
        }
        .icon { width: 55px; height: 55px; background: rgba(255,255,255,0.25); border-radius: 12px; backdrop-filter: blur(5px); }

        #v { position: fixed; opacity: 0; }
        .unlocked { transform: translateY(-100%) !important; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <div id="status">AI LOADING...</div>

    <div id="lock-screen">
        <div id="time">10:07</div>
        <p style="color:white; opacity:0.8;">Friday, Feb 20</p>
    </div>

    <div id="home-screen">
        <div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div>
        <div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div>
    </div>

<script>
    const lock = document.getElementById('lock-screen');
    const status = document.getElementById('status');

    async function startAI() {
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // 0 is faster for mobile
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(results => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                status.innerText = "HAND DETECTED! UNLOCKING...";
                lock.classList.add('unlocked');
                
                // Audio effect for video
                let synth = window.speechSynthesis;
                if(!lock.dataset.played) {
                    // Chutki ya unlock ki awaz ka illusion
                    navigator.vibrate(100);
                    lock.dataset.played = "true";
                }
            }
        });

        const cam = new Camera(document.getElementById('v'), {
            onFrame: async () => { await hands.send({image: document.getElementById('v')}); },
            width: 480, height: 360
        });
        
        cam.start().then(() => status.innerText = "READY: SHOW HAND TO UNLOCK");
    }

    window.onload = startAI;
</script>
</body>
</html>
