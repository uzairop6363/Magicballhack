<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        
        /* Wallpaper */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop') center/cover;
            z-index: 100; transition: transform 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }

        /* Clock */
        #time { color: white; font-size: 80px; font-weight: 200; margin-top: 80px; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #date { color: white; font-size: 20px; margin-top: -10px; }

        /* Fake Home Screen (Desktop) */
        #home-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1614850523296-e8c041de2394?q=80&w=2070&auto=format&fit=crop') center/cover;
            display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr);
            padding: 20px; box-sizing: border-box; gap: 20px;
        }

        .icon { width: 60px; height: 60px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 15px; margin: 0 auto; }
        
        #v { position: fixed; opacity: 0; pointer-events: none; }
        .unlocked { transform: translateY(-100%); }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>

    <div id="lock-screen">
        <div id="time">12:45</div>
        <div id="date">Friday, 20 February</div>
        <div style="position: absolute; bottom: 50px; color: rgba(255,255,255,0.7); font-size: 14px;">
            Pinch in Air to Unlock
        </div>
    </div>

    <div id="home-screen">
        <div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div>
        <div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div>
    </div>

<script>
    const lockScreen = document.getElementById('lock-screen');
    const timeDisplay = document.getElementById('time');

    // Update Real Time
    setInterval(() => {
        const now = new Date();
        timeDisplay.innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    }, 1000);

    async function initAI() {
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.8 });
        
        hands.onResults(res => {
            if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0) return;
            const lm = res.multiHandLandmarks[0];

            // PINCH GESTURE LOGIC (Index + Thumb)
            const dist = Math.sqrt(Math.pow(lm[8].x - lm[4].x, 2) + Math.pow(lm[8].y - lm[4].y, 2));
            
            if (dist < 0.04) {
                lockScreen.classList.add('unlocked');
                // Vibrating effect for realism
                if (navigator.vibrate) navigator.vibrate(50);
            }
        });

        const cam = new Camera(document.getElementById('v'), {
            onFrame: async () => await hands.send({image: document.getElementById('v')}),
            width: 640, height: 480
        });
        cam.start();
    }

    initAI();
</script>
</body>
</html>
