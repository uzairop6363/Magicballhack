<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>C9 UZAIR - VFX QUANTUM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #v { position: fixed; opacity: 0; pointer-events: none; }
        #vfx-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,255,65,0.15) 100%);
            pointer-events: none; border: 2px solid rgba(0,255,65,0.2); box-sizing: border-box;
        }
        #hud {
            position: fixed; top: 20px; right: 20px; color: #00ff41;
            font-family: 'Courier New', monospace; font-size: 10px; text-align: right;
        }
    </style>
</head>
<body>
    <div id="vfx-overlay"></div>
    <div id="hud">CORE_TEMP: STABLE<br>SIGNAL: 5G_ENCRYPTED<br>NEURAL_LINK: 98%</div>
    <video id="v" autoplay playsinline></video>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- CUBE WITH GLOW ---
    const group = new THREE.Group();
    const geometry = new THREE.BoxGeometry(0.7, 0.7, 0.7);
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 });
    const cube = new THREE.Mesh(geometry, material);
    
    // Glowing Borders
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ff41, linewidth: 3 }));
    cube.add(line);
    
    // Internal Core
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 1), new THREE.MeshBasicMaterial({ color: 0x00ff41, wireframe: true }));
    cube.add(core);
    
    group.add(cube);
    scene.add(group);
    camera.position.z = 5;

    // --- TRAILS LOGIC ---
    const trails = [];
    const maxTrails = 10;

    // --- AI HAND INTERACTION ---
    async function initVFX() {
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8 });
        
        hands.onResults(results => {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                group.visible = false;
                return;
            }
            group.visible = true;
            const lm = results.multiHandLandmarks[0];

            // 1. ADVANCED TRACKING
            const targetX = (0.5 - lm[9].x) * 10;
            const targetY = (0.5 - lm[9].y) * 6;
            
            // Lag/Smooth movement
            group.position.x += (targetX - group.position.x) * 0.15;
            group.position.y += (targetY - group.position.y) * 0.15;

            // 2. PINCH ROTATION
            const pinch = Math.sqrt(Math.pow(lm[8].x - lm[4].x, 2) + Math.pow(lm[8].y - lm[4].y, 2));
            if(pinch < 0.05) {
                cube.rotation.y += 0.1;
                cube.rotation.x += 0.05;
                core.scale.set(1.5, 1.5, 1.5);
            } else {
                cube.rotation.y += 0.02;
                core.scale.set(1, 1, 1);
            }

            // 3. AUTO-ZOOM
            const zoom = Math.sqrt(Math.pow(lm[4].x - lm[20].x, 2) + Math.pow(lm[4].y - lm[20].y, 2)) * 10;
            group.scale.set(zoom, zoom, zoom);
            
            // Create Trail clones
            if (Math.abs(targetX - group.position.x) > 0.1) {
                createTrail(group.position, group.rotation, group.scale);
            }
        });

        const cam = new Camera(document.getElementById('v'), {
            onFrame: async () => await hands.send({image: document.getElementById('v')}),
            width: 1280, height: 720
        });
        cam.start();
    }

    function createTrail(pos, rot, scl) {
        const t = group.clone();
        scene.add(t);
        trails.push({ mesh: t, alpha: 0.5 });
    }

    function animate() {
        requestAnimationFrame(animate);
        
        // Handle Trails
        for (let i = trails.length - 1; i >= 0; i--) {
            trails[i].alpha -= 0.05;
            trails[i].mesh.children[0].material.opacity = trails[i].alpha;
            if (trails[i].alpha <= 0) {
                scene.remove(trails[i].mesh);
                trails.splice(i, 1);
            }
        }

        core.rotation.z -= 0.05;
        renderer.render(scene, camera);
    }

    initVFX();
    animate();
</script>
</body>
</html>
