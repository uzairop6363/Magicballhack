<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>C9 UZAIR - 3D MINI CUBE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #v { position: fixed; opacity: 0; pointer-events: none; } /* Camera Hidden */
        #ui { 
            position: fixed; top: 20px; width: 100%; text-align: center;
            color: #00ff41; font-family: monospace; font-size: 12px; letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <div id="ui">[[ SYSTEM ACTIVE: 3D TRACKING ]]</div>

<script>
    // 1. THREE.JS SCENE SETUP
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. CREATE STYLIZED 3D CUBE (Small & Bordered)
    const geometry = new THREE.BoxGeometry(0.6, 0.6, 0.6); // Size chota kar diya
    const material = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.8 
    });
    const cube = new THREE.Mesh(geometry, material);
    
    // Borders (Outlines)
    const edges = new THREE.EdgesGeometry(geometry);
    const borderLines = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
        color: 0x00ff41, // Neon Green Borders
        linewidth: 2 
    }));
    cube.add(borderLines); // Border ko cube ka hissa bana diya
    
    scene.add(cube);
    camera.position.z = 5;

    // 3. AI HAND TRACKING
    async function startAI() {
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8 });
        
        hands.onResults(results => {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                cube.visible = false;
                return;
            }

            const lm = results.multiHandLandmarks[0];

            // GESTURE: Fist to Hide (Muthi band logic)
            const isFist = lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y;
            
            if (isFist) {
                cube.visible = false;
            } else {
                cube.visible = true;

                // Position Tracking (Palm center)
                const x = (0.5 - lm[9].x) * 8; 
                const y = (0.5 - lm[9].y) * 5;
                cube.position.x = x;
                cube.position.y = y;

                // Zoom Logic (Distance between thumb and pinky)
                const dist = Math.sqrt(Math.pow(lm[4].x - lm[20].x, 2) + Math.pow(lm[4].y - lm[20].y, 2));
                const scaleFactor = dist * 8; 
                cube.scale.set(scaleFactor, scaleFactor, scaleFactor);

                // Constant Rotation for 3D Feel
                cube.rotation.x += 0.02;
                cube.rotation.y += 0.02;
            }
        });

        const cam = new Camera(document.getElementById('v'), {
            onFrame: async () => await hands.send({image: document.getElementById('v')}),
            width: 1280, height: 720
        });
        cam.start();
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    startAI();
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
