<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>C9 UZAIR - MAGIC 2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #v { position: fixed; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; transform: scaleX(-1); }
        
        /* Realistic Ball */
        #ball {
            width: 90px; height: 90px; background: url('https://cdn-icons-png.flaticon.com/512/532/532495.png');
            background-size: cover; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); filter: drop-shadow(0 0 20px #00ff41);
            display: none; z-index: 100;
        }

        #ui { position: fixed; top: 20px; width: 100%; text-align: center; z-index: 200; }
        .stat { color: #00ff41; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; font-size: 14px; }
        .btn-box { position: fixed; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 300; }
        button { padding: 15px 25px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
        .primary { background: #00ff41; color: #000; }
        .secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #fff; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <div id="ball"></div>
    <div id="ui"><div id="msg" class="stat">AI SYSTEM READY</div></div>
    
    <div class="btn-box" id="setup">
        <button class="primary" onclick="init(true)">SENDER (Ball Idhar Hai)</button>
        <button class="secondary" onclick="init(false)">RECEIVER (Khali Phone)</button>
    </div>

<script>
    const ball = document.getElementById('ball');
    const msg = document.getElementById('msg');
    let hasBall = false;
    let client = mqtt.connect('wss://test.mosquitto.org:8081/mqtt');
    let topic = "uzair/magic/99"; // Unique Room

    client.on('connect', () => { msg.innerText = "NETWORK CONNECTED"; client.subscribe(topic); });

    client.on('message', (t, m) => {
        if(m.toString() === "FLY") { hasBall = false; gsap.to(ball, {scale: 0, duration: 0.3, onComplete: () => ball.style.display='none'}); }
        if(m.toString() === "LAND") { 
            hasBall = true; ball.style.display='block'; 
            gsap.fromTo(ball, {scale:0}, {scale:1, duration:0.5, ease: "back.out(1.7)"});
        }
    });

    async function init(first) {
        document.getElementById('setup').style.display = 'none';
        hasBall = first;
        if(hasBall) { ball.style.display='block'; client.publish(topic, "LAND"); }
        
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8});
        hands.onResults(gotHands);

        const cam = new Camera(document.getElementById('v'), {
            onFrame: async () => await hands.send({image: document.getElementById('v')}),
            width: 640, height: 480
        });
        cam.start();
        msg.innerText = "AI ACTIVE - SHOW HAND";
    }

    let lastTime = 0;
    function gotHands(res) {
        if(!res.multiHandLandmarks || res.multiHandLandmarks.length === 0) return;
        let lm = res.multiHandLandmarks[0];
        
        // Advanced Gesture Logic: Tips closer to wrist = Fist
        let isFist = lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y;
        let isOpen = lm[8].y < lm[6].y && lm[12].y < lm[10].y;

        let now = Date.now();
        if(now - lastTime < 1500) return;

        if(hasBall && isFist) {
            lastTime = now;
            client.publish(topic, "FLY");
            msg.innerText = "BALL SENT!";
        } else if(!hasBall && isOpen) {
            // Check if ball is actually flying in network
            lastTime = now;
            client.publish(topic, "LAND");
            msg.innerText = "BALL CAUGHT!";
        }
    }
</script>
</body>
</html>
