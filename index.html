<!DOCTYPE html>
<html>
<head>
    <title>C9 UZAIR - DEBUG MODE</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #000; color: #00ff41; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #v { position: fixed; opacity: 0; }
        #debug-log { background: rgba(255,0,0,0.1); padding: 20px; border: 1px solid #333; width: 80%; max-height: 200px; overflow-y: auto; font-size: 12px; }
        .box { width: 100px; height: 100px; border: 2px solid #fff; transition: 0.2s; }
        .success { border-color: #00ff41; background: rgba(0,255,65,0.2); }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    
    <h2>SYSTEM STATUS</h2>
    <div id="debug-log">Initalizing AI... Please wait.</div>
    
    <div id="visual-box" class="box" style="margin-top: 20px;"></div>
    <p>Sign: V-Sign (Victory) to Test</p>

<script>
    const log = document.getElementById('debug-log');
    const visualBox = document.getElementById('visual-box');

    function printLog(msg) {
        log.innerHTML += "<br>> " + msg;
        log.scrollTop = log.scrollHeight;
    }

    async function startSystem() {
        try {
            printLog("Loading MediaPipe Hands...");
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(results => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    // Victory Sign Logic
                    const isV = lm[8].y < lm[6].y && lm[12].y < lm[10].y && lm[16].y > lm[14].y;
                    
                    if (isV) {
                        visualBox.classList.add('success');
                        printLog("V-SIGN DETECTED!");
                    } else {
                        visualBox.classList.remove('success');
                    }
                }
            });

            printLog("Starting Camera...");
            const cam = new Camera(document.getElementById('v'), {
                onFrame: async () => {
                    await hands.send({image: document.getElementById('v')});
                },
                width: 640,
                height: 480
            });

            cam.start().then(() => {
                printLog("Camera ACTIVE. AI is watching...");
            }).catch(err => {
                printLog("CAMERA ERROR: " + err);
            });

        } catch (error) {
            printLog("CRITICAL ERROR: " + error);
        }
    }

    window.onload = startSystem;
</script>
</body>
</html>
