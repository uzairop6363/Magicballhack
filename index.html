<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #00ff41; font-family: 'Courier New', Courier, monospace; }
        #v { position: fixed; opacity: 0; pointer-events: none; }
        
        /* The Magic Object */
        #object {
            width: 150px; height: 150px;
            background: radial-gradient(circle, #00ff41, #004411);
            border-radius: 20px;
            box-shadow: 0 0 50px #00ff41;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; font-weight: bold; color: black;
            transform: scale(1);
        }

        #ui { position: fixed; top: 20px; font-weight: bold; letter-spacing: 2px; }
        .radar { position: fixed; border: 1px solid #00ff41; border-radius: 50%; opacity: 0.3; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <div id="ui">SYSTEM: TELEKINESIS ACTIVE</div>
    <div id="object">⚡</div>

    <script>
        const obj = document.getElementById('object');
        const msg = document.getElementById('ui');

        async function initMagic() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7 });

            hands.onResults(res => {
                if(!res.multiHandLandmarks || res.multiHandLandmarks.length === 0) {
                    msg.innerText = "SEARCHING FOR JEDI...";
                    return;
                }
                
                let lm = res.multiHandLandmarks[0];
                // Hand depth logic: Distance between thumb (4) and pinky (20)
                let width = Math.sqrt(Math.pow(lm[4].x - lm[20].x, 2) + Math.pow(lm[4].y - lm[20].y, 2));
                
                // Scale the object based on hand width
                let s = gsap.utils.mapRange(0.1, 0.5, 0.5, 3.5, width);
                gsap.to(obj, { scale: s, rotation: width * 500, duration: 0.2 });
                
                msg.innerText = "FORCE LEVEL: " + Math.round(s * 100) + "%";
            });

            const cam = new Camera(document.getElementById('v'), {
                onFrame: async () => await hands.send({image: document.getElementById('v')}),
                width: 1280, height: 720
            });
            cam.start();
        }

        initMagic();
    </script>
</body>
</html>
