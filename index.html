<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        
        /* Lock Screen - Isko hum slide up karenge */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://w0.peakpx.com/wallpaper/559/541/HD-wallpaper-iphone-13-original-apple-stock-ios-15.jpg') center/cover;
            z-index: 100; transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center;
        }

        #time { color: white; font-size: 80px; font-weight: 200; margin-top: 100px; }
        #date { color: white; font-size: 20px; margin-top: -10px; opacity: 0.9; }

        /* Real-Looking Home Screen */
        #home-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://w0.peakpx.com/wallpaper/559/541/HD-wallpaper-iphone-13-original-apple-stock-ios-15.jpg') center/cover;
            filter: saturate(1.2); display: flex; flex-direction: column; padding: 40px 20px; box-sizing: border-box;
        }

        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; margin-top: 20px; }
        
        .app { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .app-icon { 
            width: 60px; height: 60px; border-radius: 14px; 
            background-size: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .app-name { color: white; font-size: 11px; font-weight: 400; text-shadow: 0 1px 2px #000; }

        #v { position: fixed; opacity: 0; pointer-events: none; }
        .unlocked { transform: translateY(-110%) !important; }
        
        /* Bottom Dock */
        .dock {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            height: 85px; background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px); border-radius: 30px;
            display: flex; justify-content: space-around; align-items: center; padding: 0 10px;
        }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>

    <div id="lock-screen">
        <div id="time">10:09</div>
        <div id="date">Friday, 20 February</div>
        <div style="margin-top: auto; margin-bottom: 50px; color: white; font-size: 14px; opacity: 0.6;">Swipe or Gesture to Unlock</div>
    </div>

    <div id="home-screen">
        <div class="app-grid">
            <div class="app">
                <div class="app-icon" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg');"></div>
                <div class="app-name">WhatsApp</div>
            </div>
            <div class="app">
                <div class="app-icon" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png');"></div>
                <div class="app-name">Instagram</div>
            </div>
            <div class="app">
                <div class="app-icon" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg');"></div>
                <div class="app-name">TikTok</div>
            </div>
            <div class="app">
                <div class="app-icon" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg');"></div>
                <div class="app-name">YouTube</div>
            </div>
        </div>

        <div class="dock">
            <div class="app-icon" style="width:55px; height:55px; background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/600px-Facebook_Logo_%282019%29.png');"></div>
            <div class="app-icon" style="width:55px; height:55px; background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Google_Chrome_icon_%282022%29.svg/1200px-Google_Chrome_icon_%282022%29.svg.png');"></div>
            <div class="app-icon" style="width:55px; height:55px; background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/4e/Gmail_Icon.png');"></div>
            <div class="app-icon" style="width:55px; height:55px; background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Slack_icon_2019.svg/2048px-Slack_icon_2019.svg.png');"></div>
        </div>
    </div>

<script>
    const lock = document.getElementById('lock-screen');

    async function startAI() {
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.6 });

        hands.onResults(results => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Unlock Animation
                lock.classList.add('unlocked');
                if (navigator.vibrate) navigator.vibrate(60);
            }
        });

        const cam = new Camera(document.getElementById('v'), {
            onFrame: async () => { await hands.send({image: document.getElementById('v')}); },
            width: 480, height: 360
        });
        cam.start();
    }

    window.onload = startAI;
</script>
</body>
</html>
