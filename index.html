<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>C9 UZAIR - 360 ROTATION AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #v { position: fixed; opacity: 0; pointer-events: none; }
        #ui { 
            position: fixed; top: 20px; width: 100%; text-align: center;
            color: #00ff41; font-family: 'Courier New', monospace; font-size: 14px;
            text-transform: uppercase; letter-spacing: 2px; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">MODE: TRACKING</div>
    <video id="v" autoplay playsinline></video>

<script>
    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
    const cube = new THREE.Mesh(geometry, material);
    
    const edges = new THREE.EdgesGeometry(geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ff41, linewidth: 2 }));
    cube.add(line);
    scene.add(cube);
    camera.position.z = 5;

    let isRotating = false;
    let prevHandPos = { x: 0, y: 0 };

    // --- AI ENGINE ---
    async function initAI() {
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8 });
        
        hands.onResults(results => {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                cube.visible = false;
                return;
            }
            cube.visible = true;
            const lm = results.multiHandLandmarks[0];
            const ui = document.getElementById('ui');

            // 1. PINCH GESTURE LOGIC (Index Tip & Thumb Tip distance)
            const dist = Math.sqrt(Math.pow(lm[8].x - lm[4].x, 2) + Math.pow(lm[8].y - lm[4].y, 2));
            
            if (dist < 0.05) {
                // ROTATION MODE
                isRotating = true;
                ui.innerText = "MODE: 360° ROTATION";
                ui.style.color = "#ff3b30";

                let moveX = (lm[9].x - prevHandPos.x) * 10;
                let moveY = (lm[9].y - prevHandPos.y) * 10;

                cube.rotation.y += moveX;
                cube.rotation.x += moveY;
            } else {
                // TRACKING MODE
                isRotating = false;
                ui.innerText = "MODE: TRACKING";
                ui.style.color = "#00ff41";

                const targetX = (0.5 - lm[9].x) * 10;
                const targetY = (0.5 - lm[9].y) * 6;
                cube.position.x += (targetX - cube.position.x) * 0.1;
                cube.position.y += (targetY - cube.position.y) * 0.1;

                // Zoom logic
                const zoomDist = Math.sqrt(Math.pow(lm[4].x - lm[20].x, 2) + Math.pow(lm[4].y - lm[20].y, 2));
                const s = zoomDist * 10;
                cube.scale.set(s, s, s);
            }
            
            prevHandPos = { x: lm[9].x, y: lm[9].y };
        });

        const cam = new Camera(document.getElementById('v'), {
            onFrame: async () => await hands.send({image: document.getElementById('v')}),
            width: 1280, height: 720
        });
        cam.start();
    }

    function animate() {
        requestAnimationFrame(animate);
        if(!isRotating) {
            cube.rotation.y += 0.01; // Auto rotation when not controlled
        }
        renderer.render(scene, camera);
    }

    initAI();
    animate();
</script>
</body>
</html>
